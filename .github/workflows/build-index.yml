name: Build index

on:
  schedule:
    - cron: "30 6 * * *" # daily, after the GE guide prices update
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build index.json
        run: node scripts/build-index.mjs "$RUNNER_TEMP/index.json"

      - name: Publish to the data branch
        # The data branch holds a single commit (force-pushed) so it never grows.
        run: |
          mkdir "$RUNNER_TEMP/data" && cd "$RUNNER_TEMP/data"
          cp "$RUNNER_TEMP/index.json" index.json
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git commit -qm "Index built $(date -u +%FT%TZ)"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
